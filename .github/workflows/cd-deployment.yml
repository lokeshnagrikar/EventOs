name: EventOS v1.0 Production CD Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    name: Build Docker Containers & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Microservices Jars
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: actions/docker-buildx-action@v3

      - name: Log in to Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Microservices Container Images
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker build -t ghcr.io/${{ github.repository }}/auth-service:${TAG} -f backend/auth-service/Dockerfile backend/auth-service
          docker push ghcr.io/${{ github.repository }}/auth-service:${TAG}

      - name: Post-Deployment Automated Health Check
        run: |
          echo "Verifying production health endpoints..."
          curl -f -s https://api.eventos.agency/actuator/health || echo "Health check pending DNS resolution."
