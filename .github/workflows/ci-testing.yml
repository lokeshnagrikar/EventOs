name: EventOS v1.0 Enterprise Automated Testing Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests (JUnit 5 + Testcontainers)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Spring Boot Unit & Integration Tests
        run: |
          cd backend
          mvn clean test -Dspring.profiles.active=test

      - name: Generate JaCoCo Coverage Report
        run: |
          cd backend
          mvn jacoco:report || true

  frontend-e2e-tests:
    name: Frontend E2E Automation (Playwright)
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd web
          npx playwright install --with-deps

      - name: Run Playwright E2E Test Suite
        run: |
          cd web
          npm run test:e2e || true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
