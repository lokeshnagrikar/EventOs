version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: eventos-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventos_secure_pass}
      POSTGRES_DB: eventos_root
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-eventos_admin} -d auth_db -c 'SELECT 1;'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: eventos-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: eventos-rabbitmq-prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-eventos_guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-eventos_guest_pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: eventos-auth-prod
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=${POSTGRES_USER:-eventos_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eventos_secure_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-eventos_guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:-eventos_guest_pass}
      - SPRING_PROFILES_ACTIVE=dev
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventos-prod-net

  crm-service:
    build:
      context: ./backend
      dockerfile: crm-service/Dockerfile
    container_name: eventos-crm-prod
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=crm_db
      - POSTGRES_USER=${POSTGRES_USER:-eventos_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eventos_secure_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-eventos_guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:-eventos_guest_pass}
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventos-prod-net

  event-service:
    build:
      context: ./backend
      dockerfile: event-service/Dockerfile
    container_name: eventos-event-prod
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=event_db
      - POSTGRES_USER=${POSTGRES_USER:-eventos_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eventos_secure_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-eventos_guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:-eventos_guest_pass}
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventos-prod-net

  gallery-service:
    build:
      context: ./backend
      dockerfile: gallery-service/Dockerfile
    container_name: eventos-gallery-prod
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=gallery_db
      - POSTGRES_USER=${POSTGRES_USER:-eventos_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eventos_secure_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-eventos_guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:-eventos_guest_pass}
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventos-prod-net

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: eventos-gateway-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CRM_SERVICE_URL=http://crm-service:8082
      - EVENT_SERVICE_URL=http://event-service:8083
      - GALLERY_SERVICE_URL=http://gallery-service:8084
      - SPRING_PROFILES_ACTIVE=dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - auth-service
      - crm-service
      - event-service
      - gallery-service
      - redis
    networks:
      - eventos-prod-net

  caddy:
    image: caddy:2-alpine
    container_name: eventos-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_prod_data:/data
      - caddy_prod_config:/config
    depends_on:
      - api-gateway
    networks:
      - eventos-prod-net

volumes:
  postgres_prod_data:
  redis_prod_data:
  caddy_prod_data:
  caddy_prod_config:

networks:
  eventos-prod-net:
    driver: bridge
