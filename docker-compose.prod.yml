version: '3.8'

# ==============================================================================
# EventOS Hardened Production Stack (docker-compose.prod.yml)
# - No hardcoded fallback secrets: Mandatory injection (${VAR:?error})
# - No exposed internal ports: Only Caddy (80/443) binds publicly
# - Resource limits (deploy.resources) tuned for a 4 vCPU / 8 GB RAM VPS
# - Healthchecks and restart policies on all services
# ==============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: eventos-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: eventos_root
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d auth_db -c 'SELECT 1;'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7.2-alpine
    container_name: eventos-redis-prod
    restart: unless-stopped
    command: redis-server --protected-mode no
    volumes:
      - redis_prod_data:/data
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: eventos-rabbitmq-prod
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in production}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS must be set in production}
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: eventos-auth-prod
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in production}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:?RABBITMQ_USER must be set in production}
      - RABBITMQ_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS must be set in production}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:?RABBITMQ_PASS must be set in production}
      - SPRING_PROFILES_ACTIVE=prod
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-resend}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD must be set in production}
      - APP_MAIL_FROM=${APP_MAIL_FROM:-support@eventosapp.in}
      - FRONTEND_URL=${FRONTEND_URL:-https://eventosapp.in}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://eventosapp.in,https://www.eventosapp.in}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in production}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - GATEWAY_TRUST_SECRET=${GATEWAY_TRUST_SECRET:?GATEWAY_TRUST_SECRET must be set in production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in production}
      - BOOTSTRAP_SECRET=${BOOTSTRAP_SECRET:?BOOTSTRAP_SECRET must be set in production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - COOKIE_SECURE=true
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-None}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-eventosapp.in}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID must be set in production}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET must be set in production}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET must be set in production}
    entrypoint: ["java", "-XX:+UseSerialGC", "-Xms128m", "-Xmx512m", "-jar", "app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/api/v1/auth/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  crm-service:
    build:
      context: ./backend
      dockerfile: crm-service/Dockerfile
    container_name: eventos-crm-prod
    restart: unless-stopped
    entrypoint: ["java", "-XX:+UseSerialGC", "-Xms128m", "-Xmx512m", "-jar", "app.jar"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=crm_db
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in production}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:?RABBITMQ_USER must be set in production}
      - RABBITMQ_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS must be set in production}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:?RABBITMQ_PASS must be set in production}
      - SPRING_PROFILES_ACTIVE=prod
      - GATEWAY_TRUST_SECRET=${GATEWAY_TRUST_SECRET:?GATEWAY_TRUST_SECRET must be set in production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in production}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - AUTH_SERVICE_URL=http://auth-service:8081/api/v1/auth
      - EVENT_SERVICE_URL=http://event-service:8083/api/v1/events
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/api/v1/crm/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  event-service:
    build:
      context: ./backend
      dockerfile: event-service/Dockerfile
    container_name: eventos-event-prod
    restart: unless-stopped
    entrypoint: ["java", "-XX:+UseSerialGC", "-Xms128m", "-Xmx512m", "-jar", "app.jar"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=event_db
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in production}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:?RABBITMQ_USER must be set in production}
      - RABBITMQ_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS must be set in production}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:?RABBITMQ_PASS must be set in production}
      - SPRING_PROFILES_ACTIVE=prod
      - GATEWAY_TRUST_SECRET=${GATEWAY_TRUST_SECRET:?GATEWAY_TRUST_SECRET must be set in production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in production}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - AUTH_SERVICE_URL=http://auth-service:8081/api/v1/auth
      - CRM_SERVICE_URL=http://crm-service:8082/api/v1/crm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/api/v1/events/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  gallery-service:
    build:
      context: ./backend
      dockerfile: gallery-service/Dockerfile
    container_name: eventos-gallery-prod
    restart: unless-stopped
    entrypoint: ["java", "-XX:+UseSerialGC", "-Xms128m", "-Xmx512m", "-jar", "app.jar"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=gallery_db
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in production}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:?RABBITMQ_USER must be set in production}
      - RABBITMQ_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS must be set in production}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:?RABBITMQ_PASS must be set in production}
      - SPRING_PROFILES_ACTIVE=prod
      - GATEWAY_TRUST_SECRET=${GATEWAY_TRUST_SECRET:?GATEWAY_TRUST_SECRET must be set in production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in production}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - EVENT_SERVICE_URL=http://event-service:8083/api/v1/events
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME must be set in production}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY must be set in production}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET must be set in production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8084/api/v1/gallery/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: eventos-gateway-prod
    restart: unless-stopped
    entrypoint: ["java", "-XX:+UseSerialGC", "-Xms128m", "-Xmx512m", "-jar", "app.jar"]
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - AUTH_SERVICE_WS_URL=ws://auth-service:8081
      - CRM_SERVICE_URL=http://crm-service:8082
      - EVENT_SERVICE_URL=http://event-service:8083
      - GALLERY_SERVICE_URL=http://gallery-service:8084
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://eventosapp.in,https://www.eventosapp.in}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in production}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - GATEWAY_TRUST_SECRET=${GATEWAY_TRUST_SECRET:?GATEWAY_TRUST_SECRET must be set in production}
    depends_on:
      auth-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      gallery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  caddy:
    image: caddy:2-alpine
    container_name: eventos-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_prod_data:/data
      - caddy_prod_config:/config
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - eventos-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

volumes:
  postgres_prod_data:
  redis_prod_data:
  caddy_prod_data:
  caddy_prod_config:

networks:
  eventos-prod-net:
    driver: bridge
