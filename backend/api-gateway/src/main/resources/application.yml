server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: api-gateway
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "https://*.eventosapp.in"
              - "https://eventosapp.in"
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-websocket
          uri: ${AUTH_SERVICE_WS_URL:ws://localhost:8081}
          predicates:
            - Path=/api/v1/auth/ws, /api/v1/auth/ws/**
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          metadata:
            sensitiveHeaders: ""
        - id: crm-service
          uri: ${CRM_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/crm/**
        - id: bookings-route
          uri: ${EVENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - RewritePath=/api/v1/bookings(?<segment>.*), /api/v1/events/bookings${segment}
        - id: event-service
          uri: ${EVENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/events/**
        - id: client-portal-route
          uri: ${EVENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/client/**
          filters:
            - RewritePath=/api/v1/client(?<segment>.*), /api/v1/events/client${segment}
        - id: audit-logs-route
          uri: ${EVENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/audit-logs, /api/v1/audit-logs/**
          filters:
            - RewritePath=/api/v1/audit-logs(?<segment>.*), /api/v1/events/audit-logs${segment}
        - id: gallery-service
          uri: ${GALLERY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/gallery/**

springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /api/v1/auth/v3/api-docs
      - name: CRM Service
        url: /api/v1/crm/v3/api-docs
      - name: Event Service
        url: /api/v1/events/v3/api-docs
      - name: Gallery Service
        url: /api/v1/gallery/v3/api-docs

# Custom parameters
app:
  jwt:
    secret: ${JWT_SECRET_KEY:9a4f2c8d7e6b5a3f1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d}
    public-key: ${JWT_PUBLIC_KEY:}
  gateway:
    secret: ${GATEWAY_TRUST_SECRET:eventos_gateway_secure_shared_secret}
  rate-limiting:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-limit: ${RATE_LIMIT_DEFAULT_LIMIT:120}
    default-window-seconds: ${RATE_LIMIT_DEFAULT_WINDOW:60}
    auth-login-limit: ${RATE_LIMIT_LOGIN_LIMIT:10}
    auth-login-window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}
    auth-register-limit: ${RATE_LIMIT_REGISTER_LIMIT:5}
    auth-register-window-seconds: ${RATE_LIMIT_REGISTER_WINDOW:60}
    password-reset-limit: ${RATE_LIMIT_PASSWORD_RESET_LIMIT:5}
    password-reset-window-seconds: ${RATE_LIMIT_PASSWORD_RESET_WINDOW:60}
    otp-limit: ${RATE_LIMIT_OTP_LIMIT:5}
    otp-window-seconds: ${RATE_LIMIT_OTP_WINDOW:60}
    magic-link-limit: ${RATE_LIMIT_MAGIC_LINK_LIMIT:5}
    magic-link-window-seconds: ${RATE_LIMIT_MAGIC_LINK_WINDOW:60}
    refresh-limit: ${RATE_LIMIT_REFRESH_LIMIT:60}
    refresh-window-seconds: ${RATE_LIMIT_REFRESH_WINDOW:60}
    logout-limit: ${RATE_LIMIT_LOGOUT_LIMIT:20}
    logout-window-seconds: ${RATE_LIMIT_LOGOUT_WINDOW:60}
    superadmin-mutation-limit: ${RATE_LIMIT_SUPERADMIN_MUTATION_LIMIT:10}
    superadmin-mutation-window-seconds: ${RATE_LIMIT_SUPERADMIN_MUTATION_WINDOW:60}
    superadmin-read-limit: ${RATE_LIMIT_SUPERADMIN_READ_LIMIT:30}
    superadmin-read-window-seconds: ${RATE_LIMIT_SUPERADMIN_READ_WINDOW:60}
    public-limit: ${RATE_LIMIT_PUBLIC_LIMIT:60}
    public-window-seconds: ${RATE_LIMIT_PUBLIC_WINDOW:60}
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:127.0.0.1,::1}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.0}
