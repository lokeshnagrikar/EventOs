spring:
  datasource:
    url: jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 500
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

app:
  jwt:
    secret: 9a4f2c8d7e6b5a3f1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  gateway:
    secret: eventos_gateway_secure_shared_secret
